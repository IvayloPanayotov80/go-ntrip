<!doctype html>
<html lang="bg">
<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<title>NTRIP v2 RTCM Monitor</title>
	<style>
		body { font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; margin: 0; background: #0b0f14; color: #e6edf3; }
		header { padding: 16px; background: #0e1a25; border-bottom: 1px solid #1f2d3a; }
		main { padding: 16px; display: grid; grid-template-columns: 340px 1fr; gap: 16px; }
		.card { background: #0e1a25; border: 1px solid #1f2d3a; border-radius: 8px; padding: 12px; }
		label { display: block; font-size: 12px; color: #9fb2c3; margin-top: 8px; }
		input, select { width: 100%; padding: 8px; background: #0b141d; color: #e6edf3; border: 1px solid #203244; border-radius: 6px; }
		button { background: #1f6feb; color: #fff; border: 0; border-radius: 6px; padding: 8px 12px; cursor: pointer; }
		button.secondary { background: #30363d; }
		.row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
		.badge { display: inline-block; padding: 2px 6px; border-radius: 12px; background: #13263a; border: 1px solid #254057; color: #9bd2ff; font-size: 12px; }
		.log { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; background: #05080b; border: 1px solid #1f2d3a; border-radius: 6px; padding: 8px; height: 360px; overflow: auto; white-space: pre-wrap; }
		.kv { display: grid; grid-template-columns: 160px 1fr; gap: 8px; }
	</style>
</head>
<body>
	<header>
		<h2>NTRIP v2 RTCM Monitor</h2>
	</header>
	<main>
		<section class="card">
			<h3>Връзка</h3>
			<label>Хост</label>
			<input id="host" placeholder="example.caster.net" />
			<div class="row">
				<div>
					<label>Порт</label>
					<input id="port" type="number" placeholder="2101" value="2101" />
				</div>
				<div>
					<label>Mountpoint</label>
					<input id="mount" placeholder="MOUNT" />
				</div>
			</div>
			<div class="row">
				<div>
					<label>Потребител</label>
					<input id="user" placeholder="user" />
				</div>
				<div>
					<label>Парола</label>
					<input id="password" type="password" placeholder="password" />
				</div>
			</div>
			<div class="row">
				<div>
					<label>TLS</label>
					<select id="tls">
						<option value="0">Не</option>
						<option value="1">Да</option>
					</select>
				</div>
				<div style="display:flex; align-items:flex-end; gap:8px;">
					<button id="connect">Свържи</button>
					<button class="secondary" id="disconnect">Спри</button>
				</div>
			</div>
			<hr />
			<h3>Push (излъчване към caster)</h3>
			<label>Файл с RTCM (бинарен)</label>
			<input id="file" type="file" />
			<div style="margin-top:8px; display:flex; gap:8px;">
				<button id="push">Качи към caster</button>
			</div>
		</section>
		<section class="card">
			<div style="display:flex; align-items:center; gap:8px; justify-content:space-between;">
				<div>
					<span class="badge" id="status">disconnected</span>
				</div>
				<div class="kv">
					<div>Битрейт (B/s)</div><div id="bitrate">0</div>
					<div>Общo байтове</div><div id="bytes">0</div>
					<div>Съобщения</div><div id="messages">0</div>
				</div>
			</div>
			<div class="log" id="log"></div>
		</section>
	</main>
	<script>
		const $ = (id) => document.getElementById(id);
		let ws = null;
		let logEl = $('log');
		function log(line) {
			const atBottom = Math.abs(logEl.scrollHeight - logEl.scrollTop - logEl.clientHeight) < 4;
			logEl.textContent += line + '\n';
			if (atBottom) logEl.scrollTop = logEl.scrollHeight;
		}
		function setStatus(s) { $('status').textContent = s; }

		$('connect').onclick = () => {
			if (ws) try { ws.close(); } catch {}
			ws = new WebSocket((location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host + '/ws');
			ws.onopen = () => {
				setStatus('connecting');
				ws.send(JSON.stringify({
					action: 'connect',
					host: $('host').value.trim(),
					port: parseInt($('port').value, 10) || 2101,
					mount: $('mount').value.trim(),
					user: $('user').value.trim(),
					password: $('password').value,
					tls: $('tls').value === '1'
				}));
			};
			ws.onmessage = (ev) => {
				const msg = JSON.parse(ev.data);
				if (msg.type === 'info') { log('[i] ' + msg.message); if (msg.message.includes('Connecting')) setStatus('connecting'); }
				if (msg.type === 'error') { log('[!] ' + msg.error); setStatus('error'); }
				if (msg.type === 'stats') { $('bitrate').textContent = msg.bitrateBps; $('bytes').textContent = msg.bytesTotal; $('messages').textContent = msg.messagesParsed; if (msg.bytesTotal > 0) setStatus('streaming'); }
				if (msg.type === 'rtcm') { log('[RTCM] type=' + msg.messageNumber + ' len=' + msg.length + ' crc=0x' + (msg.crc >>> 0).toString(16)); }
				if (msg.type === 'crc_error') { log('[CRC] expected=0x' + (msg.crcExpected>>>0).toString(16) + ' got=0x' + (msg.crcComputed>>>0).toString(16)); }
			};
			ws.onclose = () => { setStatus('disconnected'); log('[i] socket closed'); };
		};

		$('disconnect').onclick = () => { if (ws) { ws.close(); ws = null; setStatus('disconnected'); } };

		$('push').onclick = async () => {
			const f = $('file').files[0];
			if (!f) { alert('Изберете файл'); return; }
			const params = new URLSearchParams({
				host: $('host').value.trim(),
				port: String(parseInt($('port').value, 10) || 2101),
				mount: $('mount').value.trim(),
				user: $('user').value.trim(),
				password: $('password').value,
				tls: $('tls').value
			});
			const resp = await fetch('/api/push?' + params.toString(), { method: 'POST', body: f });
			const text = await resp.text();
			log('[push] ' + text);
		};
	</script>
</body>
</html>
